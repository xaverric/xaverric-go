name = "xaverric-go"
main = "src/index.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "go.xaverric.cz", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "xaverric-go"
database_id = "9e6a714e-e575-4f48-bafd-1563ef7686cd"
migrations_dir = "migrations"

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "2002"
simple = { limit = 300, period = 60 }

[observability]
enabled = true

[vars]
APP_URL = "https://go.xaverric.cz"
GITHUB_CLIENT_ID = ""
